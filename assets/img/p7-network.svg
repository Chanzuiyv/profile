<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <radialGradient id="hub7" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#165DFF"/>
      <stop offset="1" stop-color="#0B2E6E"/>
    </radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg7)"/>
  <!-- 连线 -->
  <g stroke="#12A8C8" stroke-width="2" opacity="0.55">
    <line x1="200" y1="110" x2="90" y2="55"/>
    <line x1="200" y1="110" x2="310" y2="55"/>
    <line x1="200" y1="110" x2="70" y2="150"/>
    <line x1="200" y1="110" x2="330" y2="150"/>
    <line x1="200" y1="110" x2="200" y2="40"/>
    <line x1="200" y1="110" x2="200" y2="180"/>
    <line x1="90" y1="55" x2="70" y2="150"/>
    <line x1="310" y1="55" x2="330" y2="150"/>
    <line x1="90" y1="55" x2="200" y2="40"/>
    <line x1="310" y1="55" x2="200" y2="40"/>
    <line x1="70" y1="150" x2="200" y2="180"/>
    <line x1="330" y1="150" x2="200" y2="180"/>
  </g>
  <!-- 外围节点 -->
  <g fill="#165DFF" opacity="0.85">
