  <circle cx="200" cy="110" r="22" fill="url(#hub7)"/>
  <circle cx="200" cy="110" r="30" fill="none" stroke="#165DFF" stroke-width="2" opacity="0.3"/>
  <!-- 标签 -->
  <text x="200" y="115" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Hub</text>
  <text x="200" y="208" text-anchor="middle" fill="#0B2E6E" font-size="13" font-weight="bold">R · igraph · SIR 传播模型 · 鲁棒性分析</text>
